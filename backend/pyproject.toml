[project]
name = "volleyanalytics-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--strict-markers --cov=scouting --cov=config --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*", "manage.py", "config/asgi.py", "config/wsgi.py"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# E/W : pycodestyle, F : pyflakes, I : tri des imports, B : bugbear,
# UP : syntaxe moderne, DJ : règles Django, PT : style pytest
select = ["E", "W", "F", "I", "B", "UP", "DJ", "PT"]
